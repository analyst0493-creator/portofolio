<!-- File 2: admin.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans leading-relaxed">
    <div class="max-w-4xl mx-auto px-6 py-12">
        <div class="flex justify-between items-center mb-10 pb-6 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold text-cyan-400"><i class="fa-solid fa-sliders"></i> Admin Dashboard</h1>
                <p class="text-slate-400 text-sm mt-1">Perbarui informasi profil, pengalaman, dan foto Anda secara instan.</p>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl border border-slate-700 font-semibold text-sm transition flex items-center gap-2"><i class="fa-solid fa-eye"></i> Lihat Website</a>
        </div>

        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold"></div>

        <form id="admin-form" class="space-y-8">
            <!-- Informasi Utama -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-xl font-bold text-slate-200 border-b border-slate-800 pb-3">Informasi Utama</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nama Lengkap</label>
                        <input type="text" id="input-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Email Profesional</label>
                        <input type="email" id="input-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Title / Jabatan Utama</label>
                    <input type="text" id="input-title" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Tagline / Ringkasan Singkat</label>
                    <textarea id="input-tagline" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Tentang Saya (Long Bio)</label>
                    <textarea id="input-about" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Link LinkedIn</label>
                    <input type="text" id="input-linkedin" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <!-- Foto Profil -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-xl font-bold text-slate-200 border-b border-slate-800 pb-3">Foto Profil</h2>
                <div class="flex items-center gap-6">
                    <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-slate-700 bg-slate-950 flex items-center justify-center">
                        <img id="preview-photo" src="" alt="Preview" class="w-full h-full object-cover hidden">
                        <i id="preview-icon" class="fa-solid fa-user text-3xl text-slate-600"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Unggah Foto Baru (JPG/PNG)</label>
                        <input type="file" id="input-photo-file" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Keahlian -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-xl font-bold text-slate-200 border-b border-slate-800 pb-3">Keahlian (Pisahkan dengan Koma)</h2>
                <input type="text" id="input-skills" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500">
            </div>

            <!-- Tombol Aksi Simpan -->
            <div class="flex justify-end gap-4 pb-12">
                <button type="button" onclick="resetData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-6 py-3 rounded-xl transition border border-slate-700">Reset ke Default</button>
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">Simpan Perubahan</button>
            </div>
        </form>
    </div>

    <script>
        let currentPhotoBase64 = "";

        function initAdmin() {
            const data = JSON.parse(localStorage.getItem('portfolioData')) || defaultDataValues();
            
            document.getElementById('input-name').value = data.name;
            document.getElementById('input-email').value = data.email;
            document.getElementById('input-title').value = data.title;
            document.getElementById('input-tagline').value = data.tagline;
            document.getElementById('input-about').value = data.about;
            document.getElementById('input-linkedin').value = data.linkedin;
            document.getElementById('input-skills').value = data.skills.join(', ');

            currentPhotoBase64 = data.photo || "";
            updatePhotoPreview();
        }

        function defaultDataValues() {
            return {
                name: "Musliadi",
                title: "Senior Analyst - QA Data Support & System Improvement",
                tagline: "Profesional Teknik Informatika dengan pengalaman sejak 2017 di bidang operasional keuangan mikro, quality assurance, dan analisis data menggunakan SQL, Superset, Python, dan Pandas.",
                about: "Memiliki keahlian mendalam dalam manajemen kualitas data, deteksi anomali, otomatisasi laporan, serta pengembangan operasional keuangan mikro. Berbasis di Makassar, Indonesia, dengan rekam jejak kepemimpinan regional di berbagai perusahaan pembiayaan terkemuka.",
                email: "musliadi@example.com",
                linkedin: "https://linkedin.com/in/musliadi",
                photo: "",
                experiences: [
                    { role: "QA Data Support & System Improvement — Senior Analyst", company: "PT Amartha Mikro Fintek", period: "2024 – Sekarang", desc: "Mengelola kualitas data, analisis anomali, serta peningkatan sistem pendukung operasional." },
                    { role: "QA Field — Senior Analyst", company: "PT Amartha Mikro Fintek", period: "2022 – 2024", desc: "Melakukan quality assurance operasional lapangan mencakup regional Sulawesi Tengah dan Sulawesi Utara." },
                    { role: "Regional Manager", company: "PT Bina Artha Ventura", period: "2020 – 2021", desc: "Memimpin operasional regional perusahaan pembiayaan mikro." },
                    { role: "Area Manager", company: "PT Bina Artha Ventura", period: "2019 – 2020", desc: "Mengawasi area Palu dan sekitarnya." },
                    { role: "Branch Manager — Officer Development Program", company: "PT Bina Artha Ventura", period: "2017 – 2019", desc: "Bertugas di Makassar dan Poso melalui program pengembangan kepemimpinan." }
                ],
                skills: ["SQL", "Superset", "Python", "Pandas", "Google Sheets", "AppSheet", "Google Apps Script", "Quality Assurance", "Data Analysis", "Microfinance Operations"],
                portfolios: [
                    { title: "Dashboard Superset QA & Operasional", desc: "Membuat dashboard pemantauan anomali data dan performa lapangan secara real-time.", link: "#" },
                    { title: "Automasi Laporan Python & Pandas", desc: "Skrip otomatisasi pengolahan data laporan harian untuk efisiensi tim analitik.", link: "#" },
                    { title: "Sistem AppSheet Keuangan Mikro", desc: "Aplikasi pendukung operasional lapangan berbasis Google Workspace dan AppSheet.", link: "#" }
                ]
            };
        }

        document.getElementById('input-photo-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentPhotoBase64 = event.target.result;
                    updatePhotoPreview();
                };
                reader.readAsDataURL(file);
            }
        });

        function updatePhotoPreview() {
            const previewImg = document.getElementById('preview-photo');
            const previewIcon = document.getElementById('preview-icon');
            if (currentPhotoBase64) {
                previewImg.src = currentPhotoBase64;
                previewImg.classList.remove('hidden');
                previewIcon.classList.add('hidden');
            } else {
                previewImg.classList.add('hidden');
                previewIcon.classList.remove('hidden');
            }
        }

        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const existingData = JSON.parse(localStorage.getItem('portfolioData')) || defaultDataValues();

            const updatedData = {
                ...existingData,
                name: document.getElementById('input-name').value,
                email: document.getElementById('input-email').value,
                title: document.getElementById('input-title').value,
                tagline: document.getElementById('input-tagline').value,
                about: document.getElementById('input-about').value,
                linkedin: document.getElementById('input-linkedin').value,
                photo: currentPhotoBase64,
                skills: document.getElementById('input-skills').value.split(',').map(s => s.trim()).filter(s => s.length > 0)
            };

            localStorage.setItem('portfolioData', JSON.stringify(updatedData));

            const alertBox = document.getElementById('alert-box');
            alertBox.className = "mb-6 p-4 rounded-xl text-sm font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            alertBox.innerText = "Perubahan berhasil disimpan! Silakan cek halaman utama portofolio.";
            alertBox.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function resetData() {
            if (confirm("Apakah Anda yakin ingin mereset data ke pengaturan awal?")) {
                localStorage.removeItem('portfolioData');
                initAdmin();
                const alertBox = document.getElementById('alert-box');
                alertBox.className = "mb-6 p-4 rounded-xl text-sm font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20";
                alertBox.innerText = "Data telah dikembalikan ke setelan awal.";
                alertBox.classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', initAdmin);
    </script>
</body>
</html>
